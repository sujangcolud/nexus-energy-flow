<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Live Dashboard | theego084</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-blue { box-shadow: 0 0 20px rgba(37, 99, 235, 0.2); }
        .text-neon-blue { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .text-neon-amber { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-4xl space-y-6">

        <!-- Main Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tighter">CHARGER <span class="text-blue-500">LIVE</span></h1>
                <p class="text-gray-400 text-sm font-medium uppercase tracking-widest" id="charger-id-display">Station: theego084</p>
            </div>
            <div id="status-container" class="flex items-center gap-3 bg-slate-800/50 px-4 py-2 rounded-2xl border border-white/5">
                <div id="status-pulse" class="w-3 h-3 rounded-full bg-gray-500 animate-pulse"></div>
                <span id="status-text" class="text-xs font-black uppercase tracking-widest text-gray-400">Disconnected</span>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

            <!-- Power Card -->
            <div class="glass-card p-6 rounded-[2rem] glow-blue md:col-span-2">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2">Live Power Consumption</p>
                <div class="flex items-baseline gap-2">
                    <span id="power-val" class="text-6xl font-black text-white">0.00</span>
                    <span class="text-2xl font-bold text-blue-500">kW</span>
                </div>
            </div>

            <!-- Voltage & Current -->
            <div class="grid grid-cols-2 md:grid-cols-1 gap-4 md:col-span-1">
                <div class="glass-card p-5 rounded-[1.5rem]">
                    <p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Voltage</p>
                    <div class="flex items-baseline gap-1">
                        <span id="voltage-val" class="text-2xl font-black">0</span>
                        <span class="text-xs font-bold text-blue-400">V</span>
                    </div>
                </div>
                <div class="glass-card p-5 rounded-[1.5rem]">
                    <p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Current</p>
                    <div class="flex items-baseline gap-1">
                        <span id="current-val" class="text-2xl font-black">0.0</span>
                        <span class="text-xs font-bold text-blue-400">A</span>
                    </div>
                </div>
            </div>

            <!-- SoC Card -->
            <div class="glass-card p-6 rounded-[2rem] flex flex-col justify-between">
                <div>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Battery SoC</p>
                    <div class="flex items-baseline gap-1">
                        <span id="soc-val" class="text-4xl font-black text-neon-amber">--</span>
                        <span class="text-lg font-bold text-gray-500">%</span>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden mt-4 border border-white/5">
                    <div id="soc-bar" class="h-full bg-amber-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

        </div>

        <!-- Real-time Graph -->
        <div class="glass-card p-6 rounded-[2.5rem] glow-blue">
            <div class="flex justify-between items-center mb-6">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.3em]">Power Trend (kW)</p>
                <span id="last-seen" class="text-[10px] text-gray-500 font-medium">Syncing...</span>
            </div>
            <div id="power-chart" class="w-full"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
