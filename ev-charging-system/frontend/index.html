<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live EV Charging Status</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .premium-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .bg-amber-500 { background-color: #f59e0b; }
        .text-primary { color: #2563eb; }
        .bg-primary { background-color: #2563eb; }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div id="charging-card" class="w-full max-w-md bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-gray-100">
        <!-- Header -->
        <div class="bg-primary p-6 text-white flex justify-between items-center">
            <div>
                <h2 class="text-xl font-extrabold uppercase tracking-tight">Live Session</h2>
                <div id="charger-id-label" class="text-xs opacity-80 mt-1 font-semibold">ID: Waiting...</div>
            </div>
            <div id="status-badge" class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-[10px] font-black uppercase tracking-widest border border-white/30">
                Offline
            </div>
        </div>

        <div class="p-6 space-y-6">
            <!-- SoC & Main Power -->
            <div class="flex items-end justify-between">
                <div>
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Current Power</div>
                    <div class="flex items-baseline gap-1">
                        <span id="power-val" class="text-5xl font-black text-gray-900">0.0</span>
                        <span class="text-xl font-bold text-gray-400">kW</span>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Battery SoC</div>
                    <div class="flex items-baseline justify-end gap-1">
                        <span id="soc-val" class="text-3xl font-black text-amber-500">--</span>
                        <span class="text-sm font-bold text-gray-400">%</span>
                    </div>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-50 p-4 rounded-3xl border border-gray-100">
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Voltage</div>
                    <div class="flex items-baseline gap-1">
                        <span id="voltage-val" class="text-xl font-black text-gray-800">0</span>
                        <span class="text-xs font-bold text-gray-400">V</span>
                    </div>
                </div>
                <div class="bg-gray-50 p-4 rounded-3xl border border-gray-100">
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Current</div>
                    <div class="flex items-baseline gap-1">
                        <span id="current-val" class="text-xl font-black text-gray-800">0.0</span>
                        <span class="text-xs font-bold text-gray-400">A</span>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div>
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Power Consumption Trend (kW)</div>
                <div id="power-chart" class="h-40"></div>
            </div>

            <!-- Footer Status -->
            <div id="last-update" class="text-center text-[10px] text-gray-400 font-medium uppercase tracking-widest pt-2">
                Last updated: Never
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
