<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live EV Charging Dashboard | isolated module</title>
    <!-- CDN Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }
        .metric-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .metric-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .status-glow {
            box-shadow: 0 0 15px currentColor;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-5xl space-y-8">

        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">STATION <span class="text-blue-500">LIVE</span></h1>
                <p id="station-id" class="text-gray-500 text-xs font-black uppercase tracking-[0.3em] mt-1">Connecting...</p>
            </div>
            <div class="flex items-center gap-4">
                <div id="status-badge" class="px-4 py-2 rounded-full bg-gray-800 text-gray-400 text-[10px] font-black uppercase tracking-widest border border-white/5 flex items-center gap-2">
                    <div id="status-pulse" class="w-2 h-2 rounded-full bg-gray-600"></div>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>
        </div>

        <!-- Main Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Power Card (Large) -->
            <div class="metric-card md:col-span-2 border-l-4 border-l-blue-500">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Live Power Delivery</p>
                <div class="flex items-baseline gap-2">
                    <span id="power-val" class="text-7xl font-black">0.0</span>
                    <span class="text-2xl font-bold text-blue-500">kW</span>
                </div>
            </div>

            <!-- SoC Card -->
            <div class="metric-card flex flex-col justify-between border-l-4 border-l-amber-500">
                <div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Battery Level</p>
                    <div class="flex items-baseline gap-1">
                        <span id="soc-val" class="text-5xl font-black text-amber-500">--</span>
                        <span class="text-xl font-bold text-gray-500">%</span>
                    </div>
                </div>
                <div class="w-full bg-gray-900 h-2 rounded-full overflow-hidden mt-6">
                    <div id="soc-bar" class="h-full bg-amber-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <!-- Voltage -->
            <div class="metric-card">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Grid Voltage</p>
                <div class="flex items-baseline gap-1">
                    <span id="voltage-val" class="text-3xl font-black">0</span>
                    <span class="text-xs font-bold text-blue-400">V</span>
                </div>
            </div>

            <!-- Current -->
            <div class="metric-card">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Active Current</p>
                <div class="flex items-baseline gap-1">
                    <span id="current-val" class="text-3xl font-black">0.0</span>
                    <span class="text-xs font-bold text-blue-400">A</span>
                </div>
            </div>

            <!-- Session Time / Placeholder -->
            <div class="metric-card bg-gradient-to-br from-blue-900/20 to-transparent">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Last Update</p>
                <div id="last-update" class="text-sm font-bold text-blue-300">Syncing...</div>
            </div>

        </div>

        <!-- Real-time Chart -->
        <div class="metric-card">
            <div class="flex justify-between items-center mb-8">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.4em]">Power Consumption Trend</p>
            </div>
            <div id="live-power-chart" class="w-full h-64"></div>
        </div>

    </div>

    <!-- Isolated Module Logic -->
    <script src="ev-dashboard.js"></script>
</body>
</html>
